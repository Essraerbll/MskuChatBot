version: '3.8'

services:
  # FastAPI Backend
  msku-chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msku-chatbot-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./app/data:/app/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - msku-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama (Optional - for local LLM)
  # Uncomment if you want to use Ollama as fallback
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - msku-network
  #   restart: unless-stopped

networks:
  msku-network:
    driver: bridge

volumes:
  # ollama-data:  # Uncomment if using Ollama
