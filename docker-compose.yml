version: '3.8'

services:
  # FastAPI Backend - Development Mode
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: msku-chatbot-dev
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./app/data:/app/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - msku-network

  # Ollama (Optional - for local LLM)
  # Uncomment if you want to use Ollama as fallback
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: msku-ollama-dev
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - msku-network

networks:
  msku-network:
    driver: bridge

volumes:
  # ollama-data:  # Uncomment if using Ollama
