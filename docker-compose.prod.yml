version: '3.8'

services:
  # FastAPI Backend - Production Mode
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: msku-chatbot-prod
    ports:
      - "8000:8000"
    volumes:
      - ./app/data:/app/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - msku-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  msku-network:
    driver: bridge
