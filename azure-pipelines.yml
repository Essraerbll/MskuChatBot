trigger:
- main
- dev  # Hem dev hem main değişikliklerinde tetiklen

pool:
  name: 'Default'

variables:
  imageName: '10.2.8.106:5000/chatbot-proje'
  appServer: 'root@10.2.8.106'

stages:
# 1. Aşama: Build (Ortak)
- stage: Build
  displayName: Build and Push
  jobs:
  - job: Build
    steps:
    - script: |
        docker build --no-cache -t $(imageName):$(Build.BuildId) .
        docker tag $(imageName):$(Build.BuildId) $(imageName):latest
        docker push $(imageName):$(Build.BuildId)
        docker push $(imageName):latest
      displayName: 'Docker Build & Push'

# 2. Aşama: Dev Ortamına Deploy
- stage: DeployDev
  displayName: Deploy to DEV
  dependsOn: Build
  condition: eq(variables['Build.SourceBranchName'], 'dev')
  jobs:
  - job: DeployDev
    steps:
    - script: |
        ssh -o StrictHostKeyChecking=no $(appServer) "
          # 1. Spesifik versiyonu indir (Build ID ile)
          docker pull $(imageName):$(Build.BuildId) && \
          
          # 2. Eski container'ı durdur ve sil
          docker stop chatbot-dev || true && \
          docker rm chatbot-dev || true && \
          
          # 3. YENİ VERSİYONU BAŞLAT (Dikkat: latest yerine BuildId kullanıyoruz)
          docker run -d --restart=always -p 8081:80 --name chatbot-dev \
          -e ASPNETCORE_ENVIRONMENT=Development \
          $(imageName):$(Build.BuildId)
        "
      displayName: 'Run Dev Container (Port 8081)'

# 3. Aşama: Prod Ortamına Deploy
- stage: DeployProd
  displayName: Deploy to PROD
  dependsOn: Build
  condition: eq(variables['Build.SourceBranchName'], 'main')
  jobs:
  - job: DeployProd
    steps:
    - script: |
        ssh -o StrictHostKeyChecking=no $(appServer) "
          # 1. Spesifik versiyonu indir
          docker pull $(imageName):$(Build.BuildId) && \
          
          # 2. Temizlik
          docker stop chatbot-prod || true && \
          docker rm chatbot-prod || true && \
          
          # 3. Yeni versiyonu başlat
          docker run -d --restart=always -p 8080:80 --name chatbot-prod \
          -e ASPNETCORE_ENVIRONMENT=Production \
          $(imageName):$(Build.BuildId)
        "
      displayName: 'Run Prod Container (Port 8080)'